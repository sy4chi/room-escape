<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>방탈출 지도</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="header">
    <div class="logo">방탈출 지도</div>
  </header>

  <main class="hero">
    <section class="hero-left">
      <div class="badge">방탈출 추천 서비스</div>

      <h1>
        내 취향에 맞는<br />
        방탈출 테마를<br />
        찾아보세요.
      </h1>

      <p>
        지역, 인원, 장르를 선택하면<br />
        원하는 조건의 방탈출 테마와 매장을 추천해드립니다.
      </p>
    </section>

    <section class="filter-card" id="filterSection">
      <h2>방탈출 추천 필터</h2>

      <div class="filter-group">
        <label for="location">지역 선택</label>
        <select id="location">
          <option value="">전체 지역</option>
          <option value="강남">강남</option>
          <option value="홍대">홍대</option>
          <option value="건대">건대</option>
          <option value="신촌">신촌</option>
          <option value="천안">천안</option>
          <option value="대전">대전</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="people">참여 인원</label>
        <select id="people">
          <option value="">인원 선택</option>
          <option value="2">2명</option>
          <option value="3">3명</option>
          <option value="4">4명</option>
          <option value="5">5명</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="genre">장르 선택</label>
        <select id="genre">
          <option value="">장르 선택 안 함</option>
          <option value="드라마">드라마</option>
          <option value="스릴러">스릴러</option>
          <option value="어드벤쳐">어드벤쳐</option>
          <option value="추리">추리</option>
          <option value="감성">감성</option>
          <option value="공포">공포</option>
          <option value="문제방">문제방</option>
          <option value="재난">재난</option>
          <option value="판타지">판타지</option>
          <option value="일상">일상</option>
          <option value="SF">SF</option>
        </select>
      </div>

      <button class="recommend-btn">테마 추천받기</button>

      <div class="result-box" id="result">
        조건을 입력하면 추천 결과가 표시됩니다.
      </div>
    </section>
  </main>

  <section class="map-section">
    <div class="map-card">
      <div class="map-header">
        <h2>방탈출 매장 위치 지도</h2>
        <p>등록된 모든 방탈출 매장을 지도에서 확인하고 검색할 수 있습니다.</p>
      </div>

      <div class="map-layout">
        <div id="map"></div>

        <div class="store-list">
          <h3>매장 리스트</h3>
          <div id="storeList"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 여기에 카카오 JavaScript 키 넣기 -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=30f59c86fbdcf64ee62571f1884c353f&autoload=false"></script>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>방탈출 지도</title>

  <link rel="icon" href="/images/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/images/logo.png" />
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="방탈출 지도" />
  <meta property="og:description" content="내 취향에 맞는 방탈출 테마를 찾아보세요." />
  <meta property="og:image" content="https://room-escape-two.vercel.app/images/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://room-escape-two.vercel.app" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Fonts -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
  />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <div class="logo">
      <img src="images/logo.png" alt="방탈출 지도 로고">
    </div>

  </header>

  <!-- HERO -->
  <main class="hero">

    <section class="hero-left">

      <div class="badge">
        방탈출 추천 서비스
      </div>

      <h1>
        내 취향에 맞는<br />
        방탈출 테마를<br />
        찾아보세요.
      </h1>

      <p>
        지역, 인원, 장르를 선택하면<br />
        원하는 조건의 방탈출 테마와 매장을 추천해드립니다.
      </p>

    </section>

    <!-- FILTER -->
    <section class="filter-card" id="filterSection">

      <h2>방탈출 추천 필터</h2>

      <!-- 지역 -->
      <div class="filter-group">
        <label for="location">지역 선택</label>

        <select id="location">
          <option value="">전체 지역</option>
          <option value="강남">강남</option>
          <option value="홍대">홍대</option>
          <option value="건대">건대</option>
          <option value="신촌">신촌</option>
        </select>
      </div>

      <!-- 인원 -->
      <div class="filter-group">
        <label for="people">참여 인원</label>

        <select id="people">
          <option value="">인원 선택</option>
          <option value="2">2명</option>
          <option value="3">3명</option>
          <option value="4">4명</option>
          <option value="5">5명</option>
        </select>
      </div>

      <!-- 장르 -->
      <div class="filter-group">
        <label for="genre">장르 선택</label>

        <select id="genre">
          <option value="">장르 선택</option>
          <option value="드라마">드라마</option>
          <option value="스릴러">스릴러</option>
          <option value="어드벤쳐">어드벤쳐</option>
          <option value="추리">추리</option>
          <option value="감성">감성</option>
          <option value="공포">공포</option>
        </select>
      </div>

      <!-- 버튼 -->
      <button class="recommend-btn">
        테마 추천받기
      </button>

      <!-- 결과 -->
      <div class="result-box" id="result">
        조건을 입력하면 추천 결과가 표시됩니다.
      </div>

    </section>

  </main>

  <!-- MAP -->
  <section class="map-section">

    <div class="map-card">

      <div class="map-header">
        <h2>방탈출 매장 위치 지도</h2>

        <p>
          등록된 모든 방탈출 매장을 지도에서 확인하고 검색할 수 있습니다.
        </p>
      </div>

      <div class="map-layout">

        <!-- 지도 -->
        <div id="map"></div>

        <!-- 리스트 -->
        <div class="store-list">

          <h3>매장 리스트</h3>

          <div id="storeList"></div>

        </div>

      </div>

    </div>

  </section>

  <!-- JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>

</body>
</html>
